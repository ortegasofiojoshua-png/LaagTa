<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaagTa | Destination</title>

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body data-destination="dahilayan-adventure-park">

    <header>
        <a href="../index.html">Back to Home</a>
        <h1 id="destinationName"></h1>
        <p id="destinationLocation"></p>
    </header>

    <main>
        <section>
            <h2>Photos</h2>

            <div>
                <button id="previousPhoto">Previous</button>
                <img id="destinationPhoto" src="" alt="Destination photo" width="500">
                <button id="nextPhoto">Next</button>
            </div>

            <p id="photoCounter"></p>
        </section>

        <section>
            <h2>About This Destination</h2>
            <p id="destinationDescription"></p>
        </section>

        <section>
            <h2>Explore the Location</h2>
            <p>Use the map to view the destination and find your location.</p>

            <div id="map" style="height: 450px; width: 100%;"></div>

            <br>

            <button id="showMyLocationBtn">
                Find My Current Location
            </button>

            <button id="clearRouteBtn">
                Clear Route
            </button>

            <p id="locationStatus"></p>
            <div id="routeInformation"></div>
        </section>
    </main>

    <footer>
        <a href="../index.html">Return to LaagTa Homepage</a>
    </footer>

    <!-- Leaflet Map JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="../js/destination.js"></script>
</body>

</html>
